<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Ameaças Cibernéticas</title>
    <style>
        body { 
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; 
        background-color: #f4f4f9; 
        padding: 20px; 
        color: #333;
        max-width: 1100px; 
        margin: 0 auto; 
        }

        h1 { 
            text-align: center; 
            color: #1a202c; 
            font-weight: 600;
            margin-bottom: 40px; 
            margin-top: 20px;
        }

        .grafico-container { 
            background: white; 
            padding: 24px; 
            margin-bottom: 40px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
        }
    </style>
</head>
<body>

    <h1>Dashboard Global de Ameaças Cibernéticas</h1>

    <div class="grafico-container">
        {{ grafico1 | safe }}
    </div>

    <div class="grafico-container">
        {{ grafico2 | safe }}
    </div>

    <div class="grafico-container">
        {{ grafico3 | safe }}
    </div>

    <div class="grafico-container">
        {{ grafico4 | safe }}
    </div>

    <div class="grafico-container">
        {{ grafico5 | safe }}
    </div>

</body>
</html>
